name: Skill verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  provider:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Use physical fixture roots
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  stream.write(f"{name}={root}\n")
      - name: Provider regressions
        run: python -B code-cleanup-helper/scripts/self_test.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: R&D regressions
        run: python -B run-benchmark-driven-rd/scripts/self_test.py
      - name: Integration regressions
        run: python -B run-benchmark-driven-rd/scripts/regression_corpus.py
      - name: Router regressions
        run: python -B run-benchmark-driven-rd/scripts/router_quality_corpus.py --output "${{ runner.temp }}/router.json" --quiet
      - name: Replay bundled learning
        run: python -B run-benchmark-driven-rd/scripts/verify_learning_bundle.py
      - name: Cleanup context budget
        run: python -B code-cleanup-helper/scripts/check_context_budget.py code-cleanup-helper --manifest code-cleanup-helper/profiles/context-budget.json --output "${{ runner.temp }}/cleanup-budget.json" --quiet
      - name: R&D context budget
        run: python -B code-cleanup-helper/scripts/check_context_budget.py run-benchmark-driven-rd --manifest run-benchmark-driven-rd/profiles/context-budget.json --output "${{ runner.temp }}/rd-budget.json" --quiet
      - name: Source remains unchanged
        run: git diff --exit-code
